<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Laila 🎀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: #ffeaf3;
      overflow: hidden;
      color: #8d536d;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 430px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 35px;
      color: #b76587;
    }

    /* الظرف */
    .envelope {
      position: relative;
      width: 300px;
      height: 190px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .envelope:hover {
      transform: scale(1.04);
    }

    .back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #f6b8cf;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(180, 90, 120, 0.18);
    }

    .letter {
      position: absolute;
      width: 88%;
      height: 85%;
      background: #fffafa;
      left: 6%;
      top: 7%;
      border-radius: 5px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.7s ease;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
    }

    .letter p {
      font-size: 15px;
      line-height: 1.9;
      margin: 0;
    }

    .front {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: #f3a9c4;
      clip-path: polygon(0 0, 50% 65%, 100% 0, 100% 100%, 0 100%);
      z-index: 3;
      border-radius: 0 0 8px 8px;
    }

    .flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 115px;
      background: #f7c3d7;
      clip-path: polygon(0 0, 100% 0, 50% 75%);
      transform-origin: top;
      transition: 0.7s ease;
      z-index: 4;
    }

    .heart {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 65px;
      transform: translateX(-50%);
      font-size: 30px;
      transition: 0.5s ease;
    }

    .opened .flap {
      transform: rotateX(180deg);
    }

    .opened .letter {
      opacity: 1;
      transform: translateY(-85px);
    }

    .opened .heart {
      opacity: 0;
    }

    .hint {
      margin-top: 30px;
      font-size: 14px;
      color: #a86b82;
    }

    .bow {
      position: fixed;
      font-size: 25px;
      animation: float 4s infinite ease-in-out;
      opacity: 0.7;
    }

    .b1 { left: 10%; top: 15%; }
    .b2 { right: 10%; top: 25%; animation-delay: 1s; }
    .b3 { left: 15%; bottom: 15%; animation-delay: 2s; }
    .b4 { right: 15%; bottom: 12%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    .small {
      margin-top: 45px;
      font-size: 12px;
      color: #bd8198;
    }
  </style>
</head>

<body>

  <div class="bow b1">🎀</div>
  <div class="bow b2">♡</div>
  <div class="bow b3">🎀</div>
  <div class="bow b4">♡</div>

  <div class="container">

    <h1>Happy Birthday Laila 🎀</h1>

    <div class="envelope" onclick="openLetter()" id="envelope">

      <div class="back"></div>

      <div class="letter">
        <p>
          ليلى 🤍<br>
          كل عام وانتي بخيرر، عسى أيامج كلها فرحة وسعادة،
          وإن شاء الله تكون سنتج اليديدة حلوة عليج
          وتحققين فيها كل اللي تتمنينه،
          وعسى ربي يكتب لج فيها كل الخير والفرح 🎀🫶🏻
        </p>
      </div>

      <div class="flap"></div>
      <div class="front"></div>
      <div class="heart">💌</div>

    </div>

    <div class="hint" id="hint">
      اضغطي على الظرف 🎀
    </div>

    <div class="small">
      made with love ♡
    </div>

  </div>

  <script>
    function openLetter() {
      const envelope = document.getElementById("envelope");
      const hint = document.getElementById("hint");

      envelope.classList.toggle("opened");

      if (envelope.classList.contains("opened")) {
        hint.innerHTML = "for you, Laila ♡";
      } else {
        hint.innerHTML = "اضغطي على الظرف 🎀";
      }
    }
  </script>

</body>
</html>
