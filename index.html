<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Laila 🎀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffe8f1;
      font-family: Arial, sans-serif;
      color: #9b5874;
      overflow: hidden;
    }

    .page {
      text-align: center;
      width: 100%;
    }

    h1 {
      color: #c26b8d;
      font-size: 28px;
      margin-bottom: 45px;
    }

    /* الظرف كامل */
    .envelope {
      position: relative;
      width: 330px;
      height: 220px;
      margin: auto;
      cursor: pointer;
      perspective: 1000px;
    }

    /* جسم الظرف */
    .envelope-body {
      position: absolute;
      inset: 0;
      background: #f4aec8;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(180, 90, 120, 0.2);
      overflow: hidden;
      z-index: 1;
    }

    /* الخطوط اللي تعطي شكل الظرف */
    .envelope-body::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      border-left: 165px solid transparent;
      border-right: 165px solid transparent;
      border-bottom: 120px solid #ed9fbd;
    }

    .envelope-body::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      border-left: 165px solid #f8c1d6;
      border-bottom: 110px solid transparent;
    }

    /* الورقة */
    .letter {
      position: absolute;
      width: 285px;
      height: 185px;
      left: 22px;
      top: 18px;

      background: #fffdfd;
      border-radius: 8px;

      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 2;

      transition: transform 0.8s ease;
    }

    .letter p {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
    }

    /* الغطاء */
    .flap {
      position: absolute;
      left: 0;
      top: 0;

      width: 330px;
      height: 125px;

      background: #f7bfd5;

      clip-path: polygon(
        0 0,
        100% 0,
        50% 82%
      );

      transform-origin: top;
      transition: transform 0.7s ease;

      z-index: 4;
    }

    /* القلب */
    .heart {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 85px;
      transform: translateX(-50%);

      font-size: 32px;
      transition: 0.4s ease;
    }

    /* عند الفتح */
    .opened .flap {
      transform: rotateX(180deg);
    }

    .opened .letter {
      transform: translateY(-150px);
    }

    .opened .heart {
      opacity: 0;
    }

    .hint {
      margin-top: 35px;
      color: #ad6a85;
      font-size: 14px;
    }

    .decor {
      position: fixed;
      font-size: 25px;
      opacity: 0.7;
      animation: float 4s ease-in-out infinite;
    }

    .one {
      top: 15%;
      left: 10%;
    }

    .two {
      top: 25%;
      right: 10%;
      animation-delay: 1s;
    }

    .three {
      bottom: 15%;
      left: 13%;
      animation-delay: 2s;
    }

    .four {
      bottom: 12%;
      right: 13%;
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }
  </style>
</head>

<body>

  <div class="decor one">🎀</div>
  <div class="decor two">♡</div>
  <div class="decor three">🎀</div>
  <div class="decor four">♡</div>

  <div class="page">

    <h1>Happy Birthday Laila 🎀</h1>

    <div class="envelope" id="envelope" onclick="openLetter()">

      <div class="letter">
        <p>
          ليلى 🤍<br>
          كل عام وانتي بخيرر، عسى أيامج كلها فرحة وسعادة،
          وإن شاء الله تكون سنتج اليديدة حلوة عليج
          وتحققين فيها كل اللي تتمنينه،
          وعسى ربي يكتب لج فيها كل الخير والفرح 🎀🫶🏻
        </p>
      </div>

      <div class="envelope-body"></div>

      <div class="flap"></div>

      <div class="heart">💌</div>

    </div>

    <div class="hint" id="hint">
      اضغطي على الظرف 🎀
    </div>

  </div>

  <script>
    function openLetter() {

      const envelope = document.getElementById("envelope");
      const hint = document.getElementById("hint");

      envelope.classList.toggle("opened");

      if (envelope.classList.contains("opened")) {
        hint.innerHTML = "♡ for you, Laila ♡";
      } else {
        hint.innerHTML = "اضغطي على الظرف 🎀";
      }
    }
  </script>

</body>
</html>
